[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plate-reader"
version = "0.1.0"
description = "License plate detection and recognition (ALPR/ANPR) from images."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.0"]
easyocr = ["easyocr>=1.7"]
api = ["fastapi[standard]>=0.110"]
dev = ["pytest>=7.0"]

[project.scripts]
plate-reader = "plate_reader.cli:run"

[tool.setuptools.packages.find]
include = ["plate_reader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
